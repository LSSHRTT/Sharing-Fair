<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C65D3A" />
    <title>Hors ligne · Sharing Fair</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background-color: #faf7f2;
        background-image:
          radial-gradient(at 0% 0%, rgb(198 93 58 / 0.08) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgb(107 122 75 / 0.05) 0px, transparent 50%);
        color: #1f1b17;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e6dccb;
        border-radius: 16px;
        box-shadow: 0 1px 3px rgb(44 40 38 / 0.06);
        padding: 40px 28px;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        box-shadow: 0 4px 12px rgb(44 40 38 / 0.12);
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.9rem;
        line-height: 1.6;
        color: #7a6b58;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(180deg, #c65d3a, #b14a2b);
        color: #fff;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 1px 3px rgb(44 40 38 / 0.15);
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/logo.svg" alt="Sharing Fair" width="72" height="72" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        La connexion semble interrompue. Vérifiez votre réseau puis réessayez —
        vos données seront de nouveau accessibles.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
